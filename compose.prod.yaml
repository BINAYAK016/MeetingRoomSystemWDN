services:
  db:
    image: postgres:17-alpine
    environment: &database_admin
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set database administrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database administrator password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    image: wdn-meeting-rooms:production
    environment: &app_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_APP_USER:?Set application role}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set application password}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set internal hostname}
      DJANGO_HTTPS: "true"
      DJANGO_PUBLIC_BASE_URL: ${DJANGO_PUBLIC_BASE_URL:?Set HTTPS internal URL}
      EMPLOYEE_EMAIL_DOMAINS: wdn.com.np,transgate.com.np
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-172.29.16.14/32}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-disabled}
      DJANGO_FROM_EMAIL: ${DJANGO_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    networks: [database, frontend]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "deploy/check-web-health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  worker:
    build: .
    image: wdn-meeting-rooms:production
    command: python manage.py run_booking_worker
    environment: *app_environment
    networks: [database, frontend]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "manage.py", "check_worker_health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  proxy:
    image: nginx:1.30.5-alpine
    environment:
      APP_HOSTNAME: ${DJANGO_ALLOWED_HOSTS:?Set single internal hostname}
      NGINX_ENVSUBST_FILTER: APP_HOSTNAME
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    networks:
      frontend:
        ipv4_address: ${PROXY_IP:-172.29.16.14}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --no-check-certificate --header=\"Host: $$APP_HOSTNAME\" https://127.0.0.1/livez/"]
      interval: 30s
      timeout: 10s
      retries: 3

  migrate:
    build: .
    image: wdn-meeting-rooms:production
    command: python manage.py migrate --noinput
    environment:
      <<: *app_environment
      POSTGRES_USER: ${POSTGRES_USER:?Set database administrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database administrator password}
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

  db_setup:
    image: postgres:17-alpine
    command: sh /deploy/prepare-db.sh
    environment:
      <<: *database_admin
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set distinct application role}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set application password}
    volumes:
      - ./deploy/prepare-db.sh:/deploy/prepare-db.sh:ro
    networks: [database]
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

networks:
  database:
    internal: true
  frontend:
    ipam:
      config:
        - subnet: ${PROXY_NETWORK_SUBNET:-172.29.16.0/28}
          ip_range: ${PROXY_NETWORK_DYNAMIC_RANGE:-172.29.16.0/29}

volumes:
  postgres_data:
