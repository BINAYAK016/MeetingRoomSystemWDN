services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    environment: &app_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set internal hostname}
      DJANGO_HTTPS: "true"
      DJANGO_PUBLIC_BASE_URL: ${DJANGO_PUBLIC_BASE_URL:?Set HTTPS internal URL}
      EMPLOYEE_EMAIL_DOMAINS: wdn.com.np
      DJANGO_EMAIL_BACKEND: smtp
      DJANGO_FROM_EMAIL: ${DJANGO_FROM_EMAIL:?Set sender}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP relay}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python manage.py run_booking_worker
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    environment:
      APP_HOSTNAME: ${DJANGO_ALLOWED_HOSTS:?Set internal hostname}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    ports:
      - "443:443"
    depends_on:
      - web
    restart: unless-stopped

  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

volumes:
  postgres_data:
