{% extends "booking/base.html" %}{% block title %}Set staff password{% endblock %}{% block content %}<div class="page-container auth-page"><section class="panel auth-panel"><p class="eyebrow">STAFF ACCESS</p><h1>Set your password</h1><p>Use at least 12 characters. You will also need an email code each time you sign in to the staff desk.</p><form method="post" class="app-form">{% csrf_token %}<div class="form-field"><label for="password">New password</label><input type="password" id="password" name="password" autocomplete="new-password" minlength="12" required></div><div class="form-field"><label for="confirm">Confirm password</label><input type="password" id="confirm" name="confirm" autocomplete="new-password" minlength="12" required></div><button class="button button-primary">Set password →</button></form></section></div>{% endblock %}
