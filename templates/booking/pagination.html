{% if page_obj %}
<nav class="pagination" aria-label="Result pages">
  <span>{{ page_obj.paginator.count }} result{{ page_obj.paginator.count|pluralize }} · Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  <div>{% if page_obj.has_previous %}<a class="button button-quiet button-small" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.previous_page_number }}" rel="prev">Previous</a>{% endif %}
  {% if page_obj.has_next %}<a class="button button-quiet button-small" href="?{% if page_query %}{{ page_query }}&amp;{% endif %}page={{ page_obj.next_page_number }}" rel="next">Next</a>{% endif %}</div>
</nav>
{% endif %}
