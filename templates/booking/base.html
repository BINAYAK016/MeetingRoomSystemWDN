<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WDN Meeting Rooms</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; color: #17212b; background: #f4f7f9; margin: 0; }
    main { max-width: 540px; margin: 8vh auto; padding: 2rem; background: white; border: 1px solid #d9e1e7; border-radius: 12px; }
    h1 { line-height: 1.2; margin-top: 0; }
    label { display: block; font-weight: 600; margin-bottom: .4rem; }
    input { box-sizing: border-box; width: 100%; padding: .7rem; font: inherit; border: 1px solid #738391; border-radius: 6px; }
    button, .button { display: inline-block; margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: 6px; color: white; background: #0b5a74; font: inherit; cursor: pointer; text-decoration: none; }
    .muted { color: #52616d; }
  </style>
</head>
<body><main>{% block content %}{% endblock %}</main></body>
</html>
