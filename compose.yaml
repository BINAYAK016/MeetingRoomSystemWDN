services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_rooms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    environment: &app_environment
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-meeting_rooms}
      POSTGRES_USER: ${POSTGRES_USER:-meeting_rooms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_HTTPS: ${DJANGO_HTTPS:-false}
      EMPLOYEE_EMAIL_DOMAINS: ${EMPLOYEE_EMAIL_DOMAINS:-wdn.com.np}
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-file}
      DJANGO_FROM_EMAIL: ${DJANGO_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

  test:
    build: .
    command: python manage.py test -v 2
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
    profiles: [tools]

volumes:
  postgres_data:
