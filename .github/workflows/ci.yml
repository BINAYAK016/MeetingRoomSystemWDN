name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: meeting_rooms
          POSTGRES_USER: meeting_rooms
          POSTGRES_PASSWORD: ci-only-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meeting_rooms -d meeting_rooms"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-application-key-not-for-deployment
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_PUBLIC_BASE_URL: http://127.0.0.1:8000
      DJANGO_EMAIL_BACKEND: disabled
      POSTGRES_DB: meeting_rooms
      POSTGRES_USER: meeting_rooms
      POSTGRES_PASSWORD: ci-only-database-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py collectstatic --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test -v 2
      - run: python -m pip_audit -r requirements.txt
      - run: docker build -t meeting-room-booking:ci .
